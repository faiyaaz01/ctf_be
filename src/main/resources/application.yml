server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ctf-platform
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ctf_platform}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:ctfSuperSecretKeyForJwtTokenGeneration2026CTFPlatformSecureKey1234567890}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CLIENT_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    com.ctf.platform: DEBUG
